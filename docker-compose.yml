# Docker Compose v2 foundation for local AI Platform services.
#
# Usage:
#   docker compose up -d
#
# Services:
#   - FastAPI AI Platform API
#   - LiteLLM Gateway
#   - Ollama Runtime
#   - Qdrant Vector Database
#   - Open WebUI
#   - Prometheus Monitoring

name: ${COMPOSE_PROJECT_NAME:-ai-platform-lab}

services:

  # -------------------------------------------------------------
  # FastAPI AI Platform API
  #
  # Application layer
  #
  # Connects to:
  #   LiteLLM Gateway
  #   Qdrant Vector Database
  #
  # Exposes:
  #   /health
  #   /ready
  #   /chat
  #   /rag
  #   /metrics
  #
  # -------------------------------------------------------------

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ${COMPOSE_PROJECT_NAME:-ai-platform-lab}-api

    restart: unless-stopped

    environment:
      LITELLM_URL: http://litellm:${LITELLM_CONTAINER_PORT:-4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-ai-platform-lab}

      QDRANT_HOST: qdrant
      QDRANT_PORT: ${QDRANT_HTTP_CONTAINER_PORT:-6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-documents}

      CHAT_MODEL: ${CHAT_MODEL:-chat}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embedding}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-3}

    ports:
      - "${API_HOST_PORT:-8000}:8000"

    depends_on:
      litellm:
        condition: service_started

      qdrant:
        condition: service_healthy

    networks:
      - ai-platform

  # -------------------------------------------------------------
  # LiteLLM Gateway
  #
  # OpenAI-compatible model gateway
  #
  # Routing
  #
  # chat
  #   └──> ollama/qwen3:8b
  #
  # embedding
  #   └──> ollama/nomic-embed-text
  #
  # Future
  #   ├── OpenAI
  #   ├── Gemini
  #   └── Claude
  #
  # -------------------------------------------------------------

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-latest}

    container_name: ${COMPOSE_PROJECT_NAME:-ai-platform-lab}-litellm

    restart: unless-stopped

    command:
      - --config
      - /app/config/litellm.yaml
      - --port
      - "${LITELLM_CONTAINER_PORT:-4000}"

    volumes:
      - ./config/litellm.yaml:/app/config/litellm.yaml:ro

    ports:
      - "${LITELLM_HOST_PORT:-4000}:${LITELLM_CONTAINER_PORT:-4000}"

    depends_on:
      ollama:
        condition: service_healthy

    networks:
      - ai-platform

  # -------------------------------------------------------------
  # Ollama Model Runtime
  #
  # Local LLM execution engine
  #
  # -------------------------------------------------------------

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}

    container_name: ${COMPOSE_PROJECT_NAME:-ai-platform-lab}-ollama

    restart: unless-stopped

    environment:
      OLLAMA_HOST: 0.0.0.0:${OLLAMA_CONTAINER_PORT:-11434}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}

    ports:
      - "${OLLAMA_HOST_PORT:-11434}:${OLLAMA_CONTAINER_PORT:-11434}"

    volumes:
      - ollama-data:/root/.ollama

    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - ai-platform

  # -------------------------------------------------------------
  # Qdrant Vector Database
  #
  # Stores document embeddings
  #
  # -------------------------------------------------------------

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}

    container_name: ${COMPOSE_PROJECT_NAME:-ai-platform-lab}-qdrant

    restart: unless-stopped

    ports:
      - "${QDRANT_HTTP_HOST_PORT:-6333}:${QDRANT_HTTP_CONTAINER_PORT:-6333}"
      - "${QDRANT_GRPC_HOST_PORT:-6334}:${QDRANT_GRPC_CONTAINER_PORT:-6334}"

    volumes:
      - qdrant-data:/qdrant/storage

    healthcheck:
      test:
        - CMD-SHELL
        - timeout 5 bash -c '</dev/tcp/127.0.0.1/${QDRANT_HTTP_CONTAINER_PORT:-6333}'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - ai-platform

  # -------------------------------------------------------------
  # Open WebUI
  #
  # Browser UI for chatting with local models
  #
  # -------------------------------------------------------------

  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:main}

    container_name: ${COMPOSE_PROJECT_NAME:-ai-platform-lab}-open-webui

    restart: unless-stopped

    depends_on:
      ollama:
        condition: service_healthy

    environment:
      OLLAMA_BASE_URL: http://ollama:${OLLAMA_CONTAINER_PORT:-11434}

    ports:
      - "${OPEN_WEBUI_HOST_PORT:-3000}:${OPEN_WEBUI_CONTAINER_PORT:-8080}"

    volumes:
      - open-webui-data:/app/backend/data

    networks:
      - ai-platform

  # -------------------------------------------------------------
  # Prometheus
  #
  # Collects metrics from the AI Platform
  #
  # Targets:
  #   - FastAPI (/metrics)
  #
  # Future:
  #   - LiteLLM
  #   - Ollama
  #   - Qdrant
  #   - Node Exporter
  #
  # -------------------------------------------------------------

  prometheus:
    image: prom/prometheus:latest

    container_name: ${COMPOSE_PROJECT_NAME:-ai-platform-lab}-prometheus

    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      api:
        condition: service_started

    networks:
      - ai-platform
  # -------------------------------------------------------------
  # Grafana
  #
  # Platform Dashboards
  #
  # Connects to:
  #   Prometheus
  #
  # Default Login
  #
  # Username: admin
  # Password: admin
  #
  # -------------------------------------------------------------

  grafana:

    image: grafana/grafana:latest

    container_name: ${COMPOSE_PROJECT_NAME:-ai-platform-lab}-grafana

    restart: unless-stopped

    depends_on:

      prometheus:

        condition: service_started

    environment:

      GF_SECURITY_ADMIN_USER: admin

      GF_SECURITY_ADMIN_PASSWORD: admin

    ports:

      - "3001:3000"

    volumes:

      - grafana-data:/var/lib/grafana

      - ./docker/grafana/provisioning:/etc/grafana/provisioning

      - ./dashboards:/var/lib/grafana/dashboards

    networks:

      - ai-platform

# -------------------------------------------------------------
# Networking
# -------------------------------------------------------------

networks:
  ai-platform:
    driver: bridge

# -------------------------------------------------------------
# Persistent Storage
# -------------------------------------------------------------
volumes:

  ollama-data:

  qdrant-data:

  open-webui-data:

  prometheus-data:

  grafana-data: